# ============================================================
# HappenHub Backend - Application Configuration
# ============================================================

# Server
server.port=8080

# ─── MySQL Database ───────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/happenhub_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Manshii
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA / Hibernate ──────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ─── JWT ──────────────────────────────────────────────────
# IMPORTANT: Change this secret before deploying to production!
app.jwt.secret=HappenHubSuperSecretKeyThatIsLongEnoughForHS512AlgorithmMinimum64Bytes!!
app.jwt.expiration-ms=86400000

# ─── Logging ──────────────────────────────────────────────
logging.level.com.happenhub=DEBUG
logging.level.org.springframework.security=DEBUG
